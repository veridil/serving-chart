global:
  image:
    name: us-central1-docker.pkg.dev/idnorm/idnorm/tfserving
    tag: v0.1.0
    pullPolicy: IfNotPresent
  annotations: {}
  labels: {}
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
  params:
    serving:
      interOpConcurrency: 0
      intraOpConcurrency: 0
      maxGrpcThreads: 0

  imagePullSecrets: []
  env:
    - name: VD_DEC
      value: "1"
    # - name: gcr-pull-secret

  knative:
    enabled: true
    autoscaling:
      metricType: concurrency
      target: 5
      targetUtilizationPercentage: 80
      minScale: 0
      maxScale: 5
      initialScale: 1
      scaleDownDelay: 1m
      scaleToZeroGracePeriod: 30s
      stableWindow: 30s

  envoy:
    enabled: false
    image:
      name: docker.io/envoyproxy/envoy
      tag: distroless-v1.34.4
      pullPolicy: IfNotPresent
    listenPort: 8080
    adminPort: 9901
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    concurrencyRoutes:
      excludeGrpcHealth: true
      includePaths:
        - /tensorflow.serving.PredictionService/Predict
        - /tensorflow.serving.PredictionService/Classify
        - /tensorflow.serving.PredictionService/Regress
        - /tensorflow.serving.PredictionService/MultiInference
        - /tensorflow.serving.PredictionService/GetModelMetadata

  service:
    type: ClusterIP
    port: 80
    targetPort: 8500
    annotations: {}
    labels: {}

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    customMetric:
      enabled: false
      name: active-requests
      prometheusMetricName: envoy_http_downstream_rq_active
      averageValue: "4"
      scaleDownStabilizationWindowSeconds: 600

  # PodDisruptionBudget: limits simultaneous voluntary evictions (e.g. node drains)
  pdb:
    enabled: true
    # Minimum pods that must stay available (count or percentage, e.g. "50%")
    minAvailable: "50%"

  modelStorage:
    gc:
      enabled: true
      bucket: idnorm-models-enc
      path: ""
      credentialsSecret: ""

deployments: []
