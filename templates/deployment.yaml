{{- range $index, $dep := .Values.deployments }}
{{ $gc := deepCopy $.Values.global }}
{{- $dep := mergeOverwrite $gc $dep }}
{{- if not $dep.knative.enabled }}
{{- $ctx := include "tensorflow-serving.proxyCtx" (dict "dep" $dep "root" $) | fromYaml }}
{{- include "gke-concurrency-proxy.validate" $ctx }}
{{- $models := list }}
{{- if $dep.models }}
{{- $models = $dep.models }}
{{- else }}
{{- $models = list $dep.name }}
{{- end }}
{{- $servingParams := include "custom.servingParams" $dep | fromYaml }}
{{- $sanitizedName := include "tensorflow-serving.sanitizeModelName" $dep.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "d-%s" $sanitizedName }}
  namespace: {{ include "tensorflow-serving.namespace" $ }}
  labels:
    app.kubernetes.io/name: tensorflow-serving
    app.kubernetes.io/instance: {{ include "tensorflow-serving.name" $ }}
    deploymentName: {{ $dep.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tensorflow-serving
      deploymentName: {{ $dep.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tensorflow-serving
        deploymentName: {{ $dep.name }}
    spec:
      {{- if $dep.nodeSelector }}
      nodeSelector:
        {{- toYaml $dep.nodeSelector | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      initContainers:
      - name: model-downloader
        image: google/cloud-sdk:slim
        command:
        - /bin/sh
        - -c
        - |
          {{- $gsPath := "" }}
          {{- if $dep.modelStorage.gc.path }}
          {{- $gsPath = printf "%s/%s" $dep.modelStorage.gc.bucket $dep.modelStorage.gc.path }}
          {{- else }}
          {{- $gsPath = $dep.modelStorage.gc.bucket }}
          {{- end }}
          if [ -z "{{ $dep.modelStorage.gc.credentialsSecret }}" ]; then
            gsutil -m cp -r \
            {{- range $model := $models }}
            gs://{{ $gsPath }}/{{ $model }} \
            {{- end }}
            /models
          else
            gcloud auth activate-service-account --key-file=/secret/credentials.json
            gsutil -m cp -r \
            {{- range $model := $models }}
            gs://{{ $gsPath }}/{{ $model }} \
            {{- end }}
            /models
          fi
        volumeMounts:
        - name: model-volume
          mountPath: /models
        {{- if $dep.modelStorage.gc.credentialsSecret }}
        - name: secret-volume
          mountPath: /secret
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml $dep.resources | nindent 12 }}
      containers:
      - name: tensorflow-serving
        image: "{{ $dep.image.name }}:{{ $dep.image.tag }}"
        imagePullPolicy: {{ $dep.image.pullPolicy }}
        args:
        - --model_config_file=/config/model-config
        - --enable_profiler=false
        - --file_system_poll_wait_seconds=0
        - --num_load_threads={{ len $models }}
        - --grpc_max_threads={{ $servingParams.maxGrpcThreads }}
        - --tensorflow_inter_op_parallelism={{ $servingParams.interOpConcurrency }}
        - --tensorflow_intra_op_parallelism={{ $servingParams.intraOpConcurrency }}
        env:
          {{- toYaml $.Values.global.env | nindent 12 }}
        ports:
        - containerPort: 8500
          name: grpc
        readinessProbe:
          tcpSocket:
            port: 8500
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml $dep.resources | nindent 12 }}
        volumeMounts:
        - name: model-volume
          mountPath: /models
        - name: config-volume
          mountPath: /config
      {{- include "gke-concurrency-proxy.envoy.container" $ctx | nindent 6 }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ printf "cm-%s" $sanitizedName }}
      - name: model-volume
        emptyDir: {}
      {{- include "gke-concurrency-proxy.envoy.volume" $ctx | nindent 6 }}
      {{- if $dep.modelStorage.gc.credentialsSecret }}
      - name: secret-volume
        secret:
          secretName: {{ $dep.modelStorage.gc.credentialsSecret }}
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "cm-%s" $sanitizedName }}
  namespace: {{ include "tensorflow-serving.namespace" $ }}
  labels:
    app.kubernetes.io/name: tensorflow-serving
    app.kubernetes.io/instance: {{ include "tensorflow-serving.name" $ }}
    deploymentName: {{ $dep.name }}
data:
  model-config: |
    {{ include "tensorflow-serving.modelConfig" $models | nindent 4 }}
{{- include "gke-concurrency-proxy.envoy.configMap" $ctx }}

{{- end }}
{{- end }}
