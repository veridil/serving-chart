{{- range $index, $dep := .Values.deployments }}
{{ $gc := deepCopy $.Values.global }}
{{- $dep := mergeOverwrite $gc $dep }}
{{- if and (not $dep.knative.enabled) $dep.hpa.enabled }}
{{- $customMetricEnabled := dig "hpa" "customMetric" "enabled" false $dep }}
{{- if $customMetricEnabled }}
{{- $ctx := include "tensorflow-serving.proxyCtx" (dict "dep" $dep "root" $) | fromYaml }}
{{- include "gke-concurrency-proxy.hpa" $ctx }}
{{- else }}
{{- $sanitizedName := include "tensorflow-serving.sanitizeModelName" $dep.name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ printf "hpa-%s" $sanitizedName }}
  namespace: {{ include "tensorflow-serving.namespace" $ }}
  labels:
    app.kubernetes.io/name: tensorflow-serving
    app.kubernetes.io/instance: {{ include "tensorflow-serving.name" $ }}
    deploymentName: {{ $dep.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "d-%s" $sanitizedName }}
  minReplicas: {{ $dep.hpa.minReplicas }}
  maxReplicas: {{ $dep.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $dep.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
